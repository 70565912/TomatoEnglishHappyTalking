name: Bug 报告
description: 报告可以稳定复现的 Tomato 使用问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传 API Key、Token、账号、本地数据库、完整诊断包或未脱敏日志。
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - Android
        - 开发环境
        - 其它
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tomato 版本
      placeholder: 例如 v1.2.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动 App 开始，按顺序列出可以稳定触发问题的操作。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
      description: 可拖入已删除密钥、账号、本机路径和私人内容的截图或日志片段。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认提交内容不含 API Key、Token、账号、数据库或未脱敏诊断信息。
          required: true
