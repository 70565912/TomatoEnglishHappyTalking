name: 功能建议
description: 建议新的学习、创作或导出能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先描述实际使用场景和问题，再说明希望的功能。不要提交受版权保护的完整教材或私人内容。
  - type: dropdown
    id: audience
    attributes:
      label: 主要使用者
      options:
        - 家长
        - 教师
        - 学习者
        - 开发者
        - 其它
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景和问题
      description: 当前在哪个步骤遇到什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望 Tomato 如何处理？请描述结果，不必设计内部实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代做法
  - type: checkboxes
    id: cost
    attributes:
      label: 云调用与隐私
      options:
        - label: 我理解新增 AI 能力可能产生第三方云服务费用，并应优先复用本地结果。
          required: true
