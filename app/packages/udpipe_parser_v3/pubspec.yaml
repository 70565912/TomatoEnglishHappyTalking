name: udpipe_parser_v3
description: On-device UDPipe parser used by Tomato English sentence V3.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.udpipe_parser_v3
        pluginClass: UdpipeParserV3Plugin
      windows:
        pluginClass: UdpipeParserV3PluginCApi
